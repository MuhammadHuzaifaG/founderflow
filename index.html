<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FounderFlow AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">F</span>
          <div>
            <h1>FounderFlow AI</h1>
            <p>Less admin. More judgment.</p>
          </div>
        </div>
        <button id="healthButton" class="secondary-btn">Check API</button>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Founder workflow</h2>

          <form id="taskForm">
            <div class="field-group">
              <label for="companyName">Company / startup</label>
              <input id="companyName" value="Northstar Labs" />
            </div>

            <div class="field-group">
              <label for="taskType">Task type</label>
              <select id="taskType">
                <option value="market_scan">Market scan</option>
                <option value="lead_generation">Lead generation</option>
                <option value="customer_discovery">Customer discovery</option>
                <option value="competitive_analysis">Competitive analysis</option>
                <option value="meeting_summary">Meeting summary</option>
                <option value="investor_prep">Investor prep</option>
              </select>
            </div>

            <div class="field-group">
              <label for="market">Market</label>
              <input id="market" value="B2B SaaS for SMB operations" />
            </div>

            <div class="field-group">
              <label for="founderGoal">Founder goal</label>
              <textarea id="founderGoal" rows="5">We want to identify the strongest customer segment and the highest-value problem to solve before building a larger sales engine.</textarea>
            </div>

            <div class="field-group">
              <label for="context">Context</label>
              <textarea id="context" rows="4">We are a small team with limited time. We want a quick actionable strategic read before talking to customers.</textarea>
            </div>

            <button type="submit" class="primary-btn">Generate workflow output</button>
          </form>
        </section>

        <section class="panel output-panel">
          <h2>AI strategy output</h2>
          <div id="loading" class="loading hidden">Generating workflow...</div>
          <div id="result" class="result-box">
            <p class="placeholder">Your founder workflow output will appear here.</p>
          </div>

          <div id="notesBlock" class="notes-block hidden">
            <h3>Founder notes</h3>
            <form id="notesForm">
              <input id="noteTitle" type="text" placeholder="Note title" />
              <textarea id="noteBody" rows="3" placeholder="Add your decision or context"></textarea>
              <label class="checkbox-row">
                <input id="decisionFlag" type="checkbox" />
                Mark as final decision
              </label>
              <button type="submit" class="secondary-btn small-btn">Save note</button>
            </form>
            <ul id="notesList" class="notes-list"></ul>
          </div>
        </section>

        <aside class="panel history-panel">
          <h2>Recent tasks</h2>
          <ul id="historyList" class="history-list">
            <li>Loading recent founder tasks...</li>
          </ul>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
